<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#07130d"><meta name="description" content="Penalty Shooter — 3D penalty football game"><title>Penalty Shooter</title><link rel="stylesheet" href="style.css"></head><body><div id="game"></div><div id="hud"><div class="topbar"><div class="brand">PENALTY <span>SHOOTER</span></div><div class="stats"><span>LEVEL <b id="level">1</b></span><span>SCORE <b id="score">0</b></span><span>GOALS <b id="goals">0</b>/<b id="shots">0</b></span></div></div><div id="message" class="message">Choose a target and shoot!</div><div id="powerWrap"><div id="powerLabel">POWER</div><div id="powerBar"><i id="powerFill"></i></div></div></div><div id="menu" class="panel"><h1>PENALTY SHOOTER</h1><p>3D penalty football with realistic ball physics and goalkeeper AI.</p><button id="shootoutBtn">SHOOTOUT</button><button id="endlessBtn">ENDLESS</button><div class="help">Drag to aim • release to shoot</div></div><div id="result" class="panel hidden"><h2 id="resultTitle">GOAL!</h2><p id="resultText"></p><button id="nextBtn">NEXT SHOT</button><button id="restartBtn">RESTART</button></div><div id="controls" class="hidden"><button class="ctrl" id="leftBtn">◀</button><button class="ctrl" id="upBtn">▲</button><button class="ctrl" id="rightBtn">▶</button><button class="ctrl" id="spinLeft">↶</button><button class="ctrl" id="spinRight">↷</button><button class="shoot" id="shootBtn">SHOOT</button></div><script src="https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.min.js"></script><script src="game.js"></script></body></html>
