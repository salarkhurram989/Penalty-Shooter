<!doctype html><html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#07130d"><link rel="manifest" href="manifest.webmanifest"><title>Penalty Shooter</title>
<link rel="stylesheet" href="style.css"></head><body>
<canvas id="gameCanvas"></canvas>
<header id="hud"><div class="topbar"><b>⚽ PENALTY SHOOTER</b><span>🪙 <strong id="coins">250</strong></span><button id="settingsBtn">⚙</button></div>
<div class="stats"><span>GOALS <b id="goals">0</b></span><span>SHOTS <b id="shots">0</b></span><span>SCORE <b id="score">0</b></span><span>BEST <b id="best">0</b></span></div>
<div id="message" class="message">READY TO PLAY</div><div class="power"><small>SHOT POWER</small><i id="powerFill"></i></div></header>

<section id="menu" class="screen"><div class="panel hero"><small>FAST • SKILL • FOOTBALL</small><h1>PENALTY<br><em>SHOOTER</em></h1><p>Aim, curve and beat the keeper.</p>
<button id="playBtn" class="primary">▶ PLAY</button><div class="diff"><b>KEEPER</b><button data-diff="easy">EASY</button><button data-diff="medium">MEDIUM</button><button data-diff="hard">HARD</button></div>
<div class="menuActions"><button id="statsBtn">STATS</button><button id="shareBtn">SHARE</button></div></div></section>

<section id="gameUI" class="hidden"><div class="controls"><button id="curveLeft">↶</button><button id="curveRight">↷</button><button id="shootBtn" class="shoot">SHOOT<small>HOLD</small></button></div></section>

<section id="result" class="screen hidden"><div class="panel"><h2 id="resultTitle">GOAL!</h2><p id="resultText"></p><button id="nextBtn" class="primary">NEXT SHOT</button><button id="restartBtn">RESTART</button><button id="menuBtn">MENU</button></div></section>

<section id="stats" class="screen hidden"><div class="panel"><button class="close" id="closeStats">×</button><h2>STATS</h2><p>Total goals: <b id="statsGoals">0</b></p><p>Best score: <b id="statsBest">0</b></p></div></section>
<section id="settings" class="screen hidden"><div class="panel"><button class="close" id="closeSettings">×</button><h2>SETTINGS</h2><p>Penalty Shooter V6 — rebuilt from scratch.</p><button id="resetBtn">RESET PROGRESS</button></div></section>
<script src="game-v4.js?v=6"></script>
<script>
document.querySelectorAll("[data-diff]").forEach(b=>b.addEventListener("click",()=>document.getElementById("statsGoals").textContent=localStorage.getItem("psGoals")||0));
</script></body></html>
