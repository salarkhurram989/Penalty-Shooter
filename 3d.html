<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#07111d"><title>Penalty Shooter — 3D Stadium</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#07111d;color:#fff;font:14px Arial,sans-serif;touch-action:none}canvas{display:block}#hud{position:fixed;inset:0;pointer-events:none;text-shadow:0 2px 5px #000}#top{position:absolute;top:14px;left:50%;transform:translateX(-50%);padding:12px 20px;background:#061018d9;border:1px solid #ffffff35;border-radius:12px;text-align:center;min-width:220px}#top strong{font-size:22px;letter-spacing:2px}#score{font-size:17px;margin-top:5px}#message{position:absolute;top:115px;left:50%;transform:translateX(-50%);font-weight:900;letter-spacing:2px;background:#061018c9;padding:9px 14px;border-radius:8px;white-space:nowrap}#controls{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);display:flex;gap:10px;pointer-events:auto}button{border:1px solid #ffffff50;border-radius:10px;padding:13px 18px;background:#111d28e8;color:#fff;font-weight:900;letter-spacing:1px;cursor:pointer}button.primary{background:#e6b94f;color:#111;border-color:#ffe39b}#hint{position:absolute;bottom:90px;left:50%;transform:translateX(-50%);background:#061018a8;padding:8px 12px;border-radius:8px;font-size:12px;white-space:nowrap}@media(max-width:600px){#controls{width:94%;justify-content:center}button{padding:13px 12px;flex:1;font-size:11px}#hint{font-size:10px;bottom:82px}}
</style></head><body><div id="hud"><div id="top"><strong>PENALTY SHOOTER · 3D</strong><div id="score">GOALS 0 · SHOTS 0</div></div><div id="message">DRAG TO AIM · SHOOT</div><div id="hint">Drag anywhere to aim · Arrow keys or A/D also aim</div><div id="controls"><button id="aimL">◀ AIM</button><button class="primary" id="shoot">SHOOT</button><button id="aimR">AIM ▶</button><button id="back">2D MENU</button></div></div>
<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js';
const scene=new THREE.Scene();scene.background=new THREE.Color(0x8bb7d0);scene.fog=new THREE.Fog(0x8bb7d0,35,100);
const camera=new THREE.PerspectiveCamera(52,innerWidth/innerHeight,.1,180);camera.position.set(0,7.2,18);camera.lookAt(0,2,0);
const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});renderer.setPixelRatio(Math.min(devicePixelRatio||1,1.6));renderer.setSize(innerWidth,innerHeight);renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;renderer.outputColorSpace=THREE.SRGBColorSpace;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.1;document.body.prepend(renderer.domElement);
scene.add(new THREE.HemisphereLight(0xe6f4ff,0x23402d,2));const sun=new THREE.DirectionalLight(0xfff3d9,3.2);sun.position.set(-8,18,10);sun.castShadow=true;sun.shadow.mapSize.set(1024,1024);scene.add(sun);
const mat=(color,roughness=.7,metalness=0)=>new THREE.MeshStandardMaterial({color,roughness,metalness});
function box(w,h,d,m,x,y,z){const o=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),m);o.position.set(x,y,z);o.castShadow=true;o.receiveShadow=true;scene.add(o);return o}
const grass=mat(0x24753c),stripe=mat(0x2b8245),white=mat(0xf3f4ef),dark=mat(0x14202b),skin=mat(0xb97854),blue=mat(0x1668c7),yellow=mat(0xf4cf46);
box(52,.2,65,grass,0,-.16,-12);for(let i=0;i<8;i++)box(52,.012,8,stripe,0,-.05,-39+i*8);
const lineMat=new THREE.LineBasicMaterial({color:0xffffff});function line(points){const g=new THREE.BufferGeometry().setFromPoints(points.map(p=>new THREE.Vector3(...p)));scene.add(new THREE.Line(g,lineMat))}
line([[-8,.02,-38],[8,.02,-38],[8,.02,12],[-8,.02,12],[-8,.02,-38]]);line([[-8,.02,-5],[8,.02,-5]]);line([[0,.02,-5],[0,.02,-20]]);
// goal frame and net
for(const [x,y,z,sx,sy,sz] of [[-3.7,1.35,-5, .12,2.7,.12],[3.7,1.35,-5,.12,2.7,.12],[0,2.7,-5,7.5,.12,.12]])box(sx,sy,sz,white,x,y,z);
const net= new THREE.Mesh(new THREE.BoxGeometry(7.3,2.5,1.8),new THREE.MeshBasicMaterial({color:0xe5edf2,wireframe:true,transparent:true,opacity:.35}));net.position.set(0,1.3,-5.8);scene.add(net);
// stands, seats and floodlight poles
for(const side of [-1,1]){box(14,4,12,mat(0x344555),side*10,2,-13);for(let r=0;r<4;r++)box(13,.25,1.4,mat([0xc54843,0xd8dce0,0x3269a0,0xe0bd47][r]),side*10,.8+r*.7,-18+r*1.6)}
for(let x=-1;x<=1;x+=2){box(.22,13,.22,dark,x*14,6,-14);box(3,.3,1,white,x*14,12.5,-14)}
// player procedural body facing goal
function person(x,z,kit,keeper=false){const g=new THREE.Group();scene.add(g);g.position.set(x,0,z);const torso=new THREE.Mesh(new THREE.CapsuleGeometry(.42,.7,5,10),mat(kit,.5));torso.position.y=1.35;torso.castShadow=true;g.add(torso);const head=new THREE.Mesh(new THREE.SphereGeometry(.24,16,12),skin);head.position.y=2.08;head.castShadow=true;g.add(head);const shorts=new THREE.Mesh(new THREE.BoxGeometry(.65,.3,.4),dark);shorts.position.y=.82;g.add(shorts);for(const s of [-1,1]){const leg=new THREE.Mesh(new THREE.CapsuleGeometry(.12,.56,4,8),dark);leg.position.set(s*.18,.43,0);g.add(leg);const arm=new THREE.Mesh(new THREE.CapsuleGeometry(.1,.48,4,8),mat(kit));arm.position.set(s*.5,1.35,0);arm.rotation.z=s*.25;g.add(arm)}return g}
const striker=person(0,7,0xeeeeee),keeper=person(0,-4,0xf2bd35,true);keeper.scale.set(1.1,1.1,1.1);
const ball=new THREE.Mesh(new THREE.SphereGeometry(.23,24,18),mat(0xffffff,.28));ball.position.set(0,.24,5.5);ball.castShadow=true;scene.add(ball);
for(let i=0;i<5;i++){const spot=new THREE.Mesh(new THREE.CircleGeometry(.16,20),mat(0xffffff));spot.rotation.x=-Math.PI/2;spot.position.set((i-2)*.8,.01,5.5);scene.add(spot)}
let aimX=0,aimY=1.35,goals=0,shots=0,flight=null,drag=null;const msg=document.getElementById('message');const score=document.getElementById('score');
function updateAim(){msg.textContent='AIM '+(aimX<-.3?'LEFT':aimX>.3?'RIGHT':'CENTER')+' · '+(aimY>2?'HIGH':'LOW/MID')}
function shoot(){if(flight)return;shots++;const target=new THREE.Vector3(aimX*3.25,Math.max(.35,Math.min(2.5,aimY)),-5.2);const saved=Math.abs(aimX-keeper.position.x*.12)<.36&&aimY<1.9;flight={start:ball.position.clone(),target,saved,t:0,duration:.72};msg.textContent='SHOT IN FLIGHT';score.textContent='GOALS '+goals+' · SHOTS '+shots}
function finish(){if(!flight)return;const f=flight;if(!f.saved){goals++;msg.textContent='GOAL! ⚽'}else msg.textContent='SAVED!';score.textContent='GOALS '+goals+' · SHOTS '+shots;flight=null;setTimeout(()=>{if(!flight){ball.position.set(0,.24,5.5);keeper.position.x=(Math.random()-.5)*2.5}},700)}
document.getElementById('shoot').onclick=shoot;document.getElementById('aimL').onclick=()=>{aimX=Math.max(-1,aimX-.18);updateAim()};document.getElementById('aimR').onclick=()=>{aimX=Math.min(1,aimX+.18);updateAim()};document.getElementById('back').onclick=()=>location.href='./index.html';
renderer.domElement.addEventListener('pointerdown',e=>{drag={x:e.clientX,y:e.clientY};renderer.domElement.setPointerCapture(e.pointerId)});renderer.domElement.addEventListener('pointermove',e=>{if(!drag)return;aimX=Math.max(-1,Math.min(1,aimX+(e.clientX-drag.x)/innerWidth*2));aimY=Math.max(.35,Math.min(2.5,aimY-(e.clientY-drag.y)/innerHeight*2.2));drag={x:e.clientX,y:e.clientY};updateAim()});renderer.domElement.addEventListener('pointerup',()=>drag=null);addEventListener('keydown',e=>{if(e.key==='ArrowLeft'||e.key==='a')aimX=Math.max(-1,aimX-.1);if(e.key==='ArrowRight'||e.key==='d')aimX=Math.min(1,aimX+.1);if(e.code==='Space'){e.preventDefault();shoot()}updateAim()});
function animate(){requestAnimationFrame(animate);if(flight){flight.t+=.016;const u=Math.min(1,flight.t/flight.duration);ball.position.lerpVectors(flight.start,flight.target,u);ball.position.y+=Math.sin(u*Math.PI)*1.25;ball.rotation.x+=.12;ball.rotation.z+=.16;keeper.position.x+=(flight.saved?flight.target.x*.25:aimX*.3-keeper.position.x)*.04;if(u>=1)finish()}camera.position.x+=(aimX*1.5-camera.position.x)*.008;camera.lookAt(0,1.3,-1);renderer.render(scene,camera)}animate();
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
</script></body></html>
